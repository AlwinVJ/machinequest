<div class="col-lg-3 col-md-4 col-12 mb-4">
    <div class="mq-dash-sidebar">
        <!-- Dashboard Sidebar Header -->
        <div class="d-flex align-items-center mb-4 px-2 pt-1">
            <span class="mq-logo-badge" style="font-size: 0.85rem; padding: 2px 7px;">MQ</span>
            <span class="ml-2 font-weight-bold" style="font-family: var(--font-heading); font-size: 1.1rem; color: var(--mq-text-primary);">Console</span>
        </div>

        <!-- Navigation Links -->
        <div class="nav flex-column" aria-orientation="vertical">
            <a href="{% url 'dashboard' %}" class="nav-link mq-dash-link {% if request.path == '/dashboard/' %}active{% endif %}">
                <i class="fa fa-dashboard mr-2 text-muted" style="font-size: 1.1rem;"></i> Dashboard
            </a>

            {% if perms.auth.view_user %}
            <a href="{% url 'users' %}" class="nav-link mq-dash-link {% if '/users/' in request.path %}active{% endif %}">
                <i class="fa fa-users mr-2 text-muted" style="font-size: 1.1rem;"></i> Users
            </a>
            {% endif %}

            <a href="{% url 'categories' %}" class="nav-link mq-dash-link {% if '/categories/' in request.path %}active{% endif %}">
                <i class="fa fa-folder-open-o mr-2 text-muted" style="font-size: 1.1rem;"></i> Categories
            </a>

            <a href="{% url 'posts' %}" class="nav-link mq-dash-link {% if '/posts/' in request.path %}active{% endif %}">
                <i class="fa fa-file-text-o mr-2 text-muted" style="font-size: 1.1rem;"></i> Posts
            </a>

            <div class="mt-3 pt-3" style="border-top: 1px solid var(--mq-border);">
                <a href="{% url 'add_post' %}" class="nav-link mq-dash-link">
                    <i class="fa fa-plus-circle mr-2 text-muted" style="font-size: 1.1rem;"></i> Create Post
                </a>
                <a href="{% url 'home' %}" class="nav-link mq-dash-link">
                    <i class="fa fa-globe mr-2 text-muted" style="font-size: 1.1rem;"></i> View Website
                </a>
                <a href="{% url 'logout' %}" class="nav-link mq-dash-link text-danger">
                    <i class="fa fa-sign-out mr-2" style="font-size: 1.1rem;"></i> Logout
                </a>
            </div>
        </div>
    </div>
</div>
