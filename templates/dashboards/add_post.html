{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}

<div class="container-fluid p-0 mt-3">
    <div class="row">
        <!-- Dashboard Sidebar -->
        {% include 'dashboards/sidebar.html' %}

        <!-- Right Side Panel -->
        <div class="col-lg-9 col-md-8 col-12">
            <div class="mb-4 pb-2" style="border-bottom: 1px solid var(--mq-border);">
                <h2 class="font-weight-bold mb-1" style="font-size: 1.75rem;">Create New Article</h2>
                <p class="text-muted mb-0" style="font-size: 0.88rem;">Compose and publish a technical post for MachineQuest readers.</p>
            </div>

            <div class="mq-card p-4" style="max-width: 840px;">
                <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                        {{ form|crispy }}
                    </div>

                    <div class="d-flex align-items-center gap-2">
                        <button type="submit" class="mq-btn-crimson">
                            <i class="fa fa-check mr-1"></i> Create Article
                        </button>
                        <a href="{% url 'posts' %}" class="mq-btn-outline ml-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
